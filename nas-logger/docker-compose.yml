# Home automation event logger
#
#   cd nas-logger
#   docker compose up -d
#
# Daily log files go to ./logs next to this file. To store them elsewhere,
# set LOG_PATH, e.g. in a .env file next to this one:
#   LOG_PATH=/volume1/homeauto-logs

services:
  homeauto-logger:
    image: python:3.12-alpine
    container_name: homeauto-logger
    restart: unless-stopped
    command: ["python", "-u", "/app/nas_logger.py"]
    ports:
      - "5140:5140/udp"   # must match logPort in the sketch
    environment:
      LOG_DIR: /logs
      LOG_PORT: "5140"
    volumes:
      - ./nas_logger.py:/app/nas_logger.py:ro
      - ${LOG_PATH:-./logs}:/logs
      - /etc/localtime:/etc/localtime:ro   # log timestamps in the NAS's time zone

  # Web app: dashboard + log browser on http://<nas>:8080
  # Relay control needs DEVICE_IP and DEVICE_KEY (= LOCAL_CONTROL_KEY in
  # secrets.h); protect it with a login (WEB_USER / WEB_PASSWORD).
  # Set these in the .env file next to this one.
  homeauto-web:
    image: python:3.12-alpine
    container_name: homeauto-web
    restart: unless-stopped
    command: ["python", "-u", "/app/web_app.py"]
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      LOG_DIR: /logs
      WEB_PORT: "8080"
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      DEVICE_IP: ${DEVICE_IP:-}
      DEVICE_KEY: ${DEVICE_KEY:-}
      DEVICE_PORT: ${DEVICE_PORT:-5140}   # logPort in the sketch
      RELAY_NAMES: ${RELAY_NAMES:-}
    volumes:
      - ./web_app.py:/app/web_app.py:ro
      - ./static:/app/static:ro
      - ${LOG_PATH:-./logs}:/logs:ro
      - /etc/localtime:/etc/localtime:ro
