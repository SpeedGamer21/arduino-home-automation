<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Automation</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --border: #dde1e6;
    --text: #1b1f24; --muted: #5f6b7a; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --bad: #b91c1c; --warn: #a16207;
    --relay: #2563eb; --network: #a16207; --system: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1f252d; --border: #2c333d;
      --text: #e6e9ed; --muted: #95a1af; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --bad: #f87171; --warn: #facc15;
      --relay: #60a5fa; --network: #facc15; --system: #c4b5fd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 20px 0 12px; }
  header h1 { font-size: 20px; margin: 0; margin-right: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
          background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .reading { font-variant-numeric: tabular-nums; font-weight: 600; }

  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
               padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--muted); font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .error { color: var(--bad); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
          display: flex; flex-direction: column; gap: 10px; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .name { font-weight: 600; }
  .card .kind { color: var(--muted); font-size: 13px; }
  .state { font-size: 13px; font-weight: 600; color: var(--muted); }
  .state.on { color: var(--ok); }

  button.btn, a.btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
          border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
          text-decoration: none; text-align: center; white-space: nowrap; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.btn:disabled, a.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .toolbar input, .toolbar select { background: var(--surface); color: var(--text); border: 1px solid var(--border);
          border-radius: 8px; padding: 8px 10px; font: inherit; min-width: 0; }
  .toolbar input[type="search"] { flex: 1 1 200px; }
  .toolbar .spacer { flex: 1 0 0; }

  .log { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .log .day { padding: 8px 14px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--muted);
              border-top: 1px solid var(--border); }
  .log .day:first-child { border-top: 0; }
  .log .row { display: flex; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--border); align-items: baseline; }
  .log .day + .row { border-top: 0; }
  .log .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; flex: none; }
  .log .text { overflow-wrap: anywhere; }
  .log .row .dot { align-self: center; }
  .dot.relay { background: var(--relay); } .dot.network { background: var(--network); } .dot.system { background: var(--system); }
  .log .empty { padding: 20px 14px; color: var(--muted); }
  .more { display: flex; justify-content: center; margin-top: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Home Automation</h1>
    <span class="pill"><span id="statusDot" class="dot"></span><span id="statusText">Loading…</span></span>
    <span class="pill">Temp <span id="temp" class="reading">--</span></span>
    <span class="pill">Humidity <span id="hum" class="reading">--</span></span>
  </header>

  <nav role="tablist">
    <button role="tab" id="tabDash" aria-selected="true" data-panel="dash">Dashboard</button>
    <button role="tab" id="tabLogs" aria-selected="false" data-panel="logs">Logs</button>
  </nav>

  <section id="dash">
    <h2>Relays</h2>
    <p id="relayNote" class="note" hidden></p>
    <div id="relays" class="grid"></div>

    <h2>Recent activity</h2>
    <div id="recent" class="log"></div>
    <div class="more"><button class="btn" id="viewAll">View all logs</button></div>
  </section>

  <section id="logs" hidden>
    <div class="toolbar">
      <select id="day" aria-label="Day"><option value="">All days</option></select>
      <select id="kind" aria-label="Event type">
        <option value="">All events</option>
        <option value="relay">Relays</option>
        <option value="network">Network</option>
        <option value="system">System</option>
      </select>
      <input id="q" type="search" placeholder="Search, e.g. Relay 5 or IR remote" aria-label="Search">
    </div>
    <div class="toolbar">
      <span id="count" class="note" style="margin:0;align-self:center"></span>
      <span class="spacer"></span>
      <a class="btn" id="dlDay" aria-disabled="true">Download day (.txt)</a>
      <a class="btn" href="api/logs.zip">Download all (.zip)</a>
    </div>
    <div id="entries" class="log"></div>
    <div class="more"><button class="btn" id="more" hidden>Load more</button></div>
    <div class="legend">
      <span><span class="dot relay"></span>Relay</span>
      <span><span class="dot network"></span>Network</span>
      <span><span class="dot system"></span>System</span>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const PAGE = 200;

async function api(path, options) {
  const r = await fetch(path, options);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtDay(day) {
  const d = new Date(day + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}

// ---------- Tabs ----------
function showTab(panel) {
  for (const b of document.querySelectorAll("nav button")) {
    const on = b.dataset.panel === panel;
    b.setAttribute("aria-selected", on);
    $("#" + b.dataset.panel).hidden = !on;
  }
  if (panel === "logs") loadEntries(true);
  try { localStorage.setItem("tab", panel); } catch (_) {}
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => showTab(b.dataset.panel);
$("#viewAll").onclick = () => showTab("logs");

// ---------- Log rendering ----------
function renderEntries(container, entries, append) {
  if (!append) container.replaceChildren();
  let lastDay = container.dataset.lastDay || "";
  if (!append) lastDay = "";
  for (const e of entries) {
    const [day, time] = e.time.split(" ");
    if (day !== lastDay) {
      container.append(el("div", "day", fmtDay(day)));
      lastDay = day;
    }
    const row = el("div", "row");
    row.append(el("span", "dot " + e.kind), el("span", "time", time), el("span", "text", e.text));
    container.append(row);
  }
  container.dataset.lastDay = lastDay;
  if (!container.children.length) container.append(el("div", "empty", "No log entries."));
}

// ---------- Dashboard ----------
let status = null;

async function loadStatus() {
  try {
    status = await api("api/status");
  } catch (err) {
    status = { blynk: true, online: false, error: err.message };
  }
  renderStatus();
}

function renderStatus() {
  const s = status;
  const dot = $("#statusDot"), text = $("#statusText"), note = $("#relayNote");
  dot.className = "dot";
  note.hidden = true;
  note.classList.remove("error");

  if (!s.blynk) {
    text.textContent = "Logs only";
    note.textContent = "Set BLYNK_TOKEN on the server to show relays and readings and control them from here.";
    note.hidden = false;
  } else if (s.error) {
    dot.classList.add("bad");
    text.textContent = "Blynk unreachable";
    note.textContent = s.error;
    note.classList.add("error");
    note.hidden = false;
  } else {
    dot.classList.add(s.online ? "ok" : "bad");
    text.textContent = s.online ? "Controller online" : "Controller offline";
    if (!s.online) {
      note.textContent = "The controller is offline, so relays can only be switched locally. States shown are the last known.";
      note.hidden = false;
    }
  }
  $("#temp").textContent = s.temperature != null ? s.temperature.toFixed(1) + " °C" : "--";
  $("#hum").textContent = s.humidity != null ? Math.round(s.humidity) + " %" : "--";

  const grid = $("#relays");
  grid.replaceChildren();
  grid.hidden = !s.relays;
  if (!s.relays) return;
  const canControl = s.online && !s.error;

  for (const r of s.relays) {
    const card = el("div", "card");
    const top = el("div", "top");
    top.append(el("span", "name", r.name), el("span", "kind", r.momentary ? "Pulse 1 s" : "On / off"));
    card.append(top);

    if (r.momentary) {
      const btn = el("button", "btn primary", "Pulse");
      btn.disabled = !canControl;
      btn.onclick = () => relayAction(btn, r, {}, "Sent");
      card.append(btn);
    } else {
      card.append(el("span", "state" + (r.on ? " on" : ""), r.on ? "ON" : "OFF"));
      const btn = el("button", "btn" + (r.on ? "" : " primary"), r.on ? "Turn off" : "Turn on");
      btn.disabled = !canControl;
      btn.onclick = () => relayAction(btn, r, { on: !r.on }, r.on ? "Turned off" : "Turned on");
      card.append(btn);
    }
    grid.append(card);
  }
}

async function relayAction(btn, relay, body, doneText) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    await api("api/relay/" + relay.n, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    btn.textContent = doneText;
    if (!relay.momentary) relay.on = body.on;
    setTimeout(() => { renderStatus(); loadRecent(); }, 1200);
  } catch (err) {
    btn.textContent = label;
    btn.disabled = false;
    alert(relay.name + ": " + err.message);
  }
}

async function loadRecent() {
  try {
    const r = await api("api/entries?limit=15");
    renderEntries($("#recent"), r.entries, false);
  } catch (err) {
    $("#recent").replaceChildren(el("div", "empty error", err.message));
  }
}

// ---------- Logs ----------
let offset = 0;
let requestId = 0;

async function loadDays() {
  const days = await api("api/days").catch(() => []);
  const sel = $("#day");
  const current = sel.value;
  sel.replaceChildren(el("option", null, "All days"));
  sel.firstChild.value = "";
  for (const d of days) {
    const o = el("option", null, fmtDay(d.day));
    o.value = d.day;
    sel.append(o);
  }
  sel.value = current;
}

async function loadEntries(reset) {
  if (reset) offset = 0;
  const id = ++requestId;
  const params = new URLSearchParams({ offset, limit: PAGE });
  const day = $("#day").value, kind = $("#kind").value, q = $("#q").value.trim();
  if (day) params.set("day", day);
  if (kind) params.set("kind", kind);
  if (q) params.set("q", q);

  const dl = $("#dlDay");
  dl.setAttribute("aria-disabled", !day);
  if (day) dl.href = "api/logs/" + day + ".txt"; else dl.removeAttribute("href");

  try {
    const r = await api("api/entries?" + params);
    if (id !== requestId) return;  // a newer filter is already loading
    renderEntries($("#entries"), r.entries, !reset);
    offset += r.entries.length;
    $("#count").textContent = r.total === 1 ? "1 entry" : r.total.toLocaleString() + " entries";
    $("#more").hidden = offset >= r.total;
  } catch (err) {
    if (id !== requestId) return;
    $("#entries").replaceChildren(el("div", "empty error", err.message));
    $("#more").hidden = true;
  }
}

let searchTimer;
$("#q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadEntries(true), 250); };
$("#day").onchange = () => loadEntries(true);
$("#kind").onchange = () => loadEntries(true);
$("#more").onclick = () => loadEntries(false);

// ---------- Start ----------
loadStatus();
loadRecent();
loadDays();
let savedTab = "dash";
try { savedTab = localStorage.getItem("tab") || "dash"; } catch (_) {}
showTab(savedTab === "logs" ? "logs" : "dash");

// Refresh while the page is visible; the server caches Blynk for 10 s
setInterval(() => {
  if (document.hidden) return;
  loadStatus();
  loadRecent();
}, 15000);
setInterval(() => { if (!document.hidden) loadDays(); }, 60000);
</script>
</body>
</html>
