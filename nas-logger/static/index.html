<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Automation</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }

  /* Header */
  .hero { border-bottom: 1px solid var(--border); position: relative; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
                 background: linear-gradient(90deg, transparent, var(--red) 20%, var(--red) 80%, transparent); }
  .hero-shade { background: linear-gradient(180deg, rgba(7,7,8,.35), rgba(7,7,8,.85)); }
  .hero .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding-top: 22px; padding-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-right: auto; }
  .gauges { display: flex; flex-wrap: wrap; gap: 10px; }
  .gauge { background: rgba(17,17,20,.85); border: 1px solid var(--border-hi); padding: 8px 16px; min-width: 112px;
           clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  .gauge .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .gauge .value { font-size: 22px; font-weight: 800; font-style: italic; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .gauge .value small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }
  .gauge .status { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; font-style: italic;
                   text-transform: uppercase; letter-spacing: .5px; line-height: 1.2; margin-top: 4px; }
  .logout { margin: 0 0 0 auto; }
  @media (max-width: 600px) {
    .gauges { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .gauge { min-width: 0; }
  }

  /* Tabs */
  nav { display: flex; gap: 6px; margin: 22px 0 6px; }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 18px; font: inherit; font-weight: 800;
               font-style: italic; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; cursor: pointer;
               clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%); }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] { color: #fff; background: var(--red); }

  h2 { display: flex; align-items: center; gap: 12px; font-size: 13px; margin: 26px 0 12px; color: var(--text);
       font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 2px; }
  h2::before { content: ""; width: 4px; height: 16px; background: var(--red); transform: skewX(-15deg); }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  /* Climate dials: segmented arc with a redline, like a digital rev counter */
  .dials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .dial-card { position: relative; display: flex; justify-content: center; padding: 14px 10px 4px;
               border: 1px solid var(--border); overflow: hidden;
               background: radial-gradient(circle at 50% 48%, #1c1c21 0, #0d0d0f 68%); }
  .dial-card::before { content: ""; position: absolute; top: 0; left: 0; width: 42px; height: 3px; background: var(--red); }
  .dial { display: block; width: 100%; max-width: 270px; overflow: visible; }
  .dial .ring { fill: none; stroke: #2a2a31; stroke-width: 1; }
  .dial .redline { fill: none; stroke: var(--red); stroke-width: 2.5; }
  .dial .seg { stroke: #222228; stroke-width: 4.6; transition: stroke .12s; }
  .dial .seg.red { stroke: rgba(228, 0, 43, .26); }
  .dial .seg.lit { stroke: #ececf1; }
  .dial .seg.red.lit { stroke: var(--red-hi); filter: drop-shadow(0 0 3px var(--red)); }
  .dial .major { stroke: #55555f; stroke-width: 1.5; }
  .dial .tick { fill: var(--muted); font-size: 9px; font-weight: 700; font-style: italic; text-anchor: middle; dominant-baseline: middle; }
  .dial .value { fill: var(--text); font-size: 42px; font-weight: 900; font-style: italic; text-anchor: middle;
                 font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .dial .unit { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
  .dial .zone { font-size: 10px; font-weight: 800; font-style: italic; letter-spacing: 2px; text-anchor: middle; fill: var(--muted); }
  .dial .zone.hot { fill: var(--red-hi); }
  .dial .label { fill: var(--text); font-size: 11px; font-weight: 800; font-style: italic; letter-spacing: 3px; text-anchor: middle; }

  /* Relay cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { position: relative; background: linear-gradient(160deg, var(--surface-2), var(--surface) 60%);
          border: 1px solid var(--border); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;
          overflow: hidden; transition: border-color .2s, box-shadow .2s; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; width: 42px; height: 3px; background: var(--border-hi); }
  .card:hover { border-color: var(--border-hi); }
  .card.on { border-color: rgba(228,0,43,.6); box-shadow: 0 0 0 1px rgba(228,0,43,.25), 0 8px 30px -10px var(--red-glow); }
  .card.on::before, .card.momentary::before { background: var(--red); }
  .card .num { position: absolute; right: 12px; top: 4px; font-size: 40px; font-weight: 900; font-style: italic;
               color: rgba(255,255,255,.04); line-height: 1; pointer-events: none; }
  .card .name { font-weight: 700; font-size: 16px; }
  .card .kind { color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
  .card .row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .led { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; font-style: italic; letter-spacing: 1px; color: var(--muted); }
  .led::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #2c2c33; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  .led.on { color: var(--red-hi); }
  .led.on::before { background: var(--red-hi); box-shadow: 0 0 10px var(--red), 0 0 2px #fff inset; }
  .card .btn { flex: 1; }
  .card .row2 .btn { flex: 0 0 auto; min-width: 116px; }

  /* Logs */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .toolbar input[type="search"] { flex: 1 1 220px; }
  .toolbar .spacer { flex: 1 0 0; }
  .count { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; align-self: center; }
  .log { background: var(--surface); border: 1px solid var(--border); }
  .log .day { padding: 8px 16px; background: #0c0c0e; font-size: 12px; font-weight: 800; font-style: italic; color: var(--muted);
              text-transform: uppercase; letter-spacing: 1.5px; border-top: 1px solid var(--border); border-left: 3px solid var(--red); }
  .log .day:first-child { border-top: 0; }
  .log .row { display: flex; gap: 14px; padding: 9px 16px; border-top: 1px solid #1c1c21; align-items: baseline; }
  .log .row:hover { background: var(--surface-2); }
  .log .day + .row { border-top: 0; }
  .log .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; flex: none; font-family: ui-monospace, Consolas, monospace; }
  .log .text { overflow-wrap: anywhere; }
  .log .row .dot { align-self: center; }
  .dot.relay { background: var(--relay); box-shadow: 0 0 6px var(--red); }
  .dot.network { background: var(--network); } .dot.system { background: var(--system); }
  .log .empty { padding: 20px 16px; color: var(--muted); }
  .more { display: flex; justify-content: center; margin-top: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin: 12px 0 0; letter-spacing: 1px; text-transform: uppercase; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<header class="hero carbon">
  <div class="hero-shade">
    <div class="wrap">
      <div class="brand">
        <span class="badge">HA</span>
        <div>
          <h1 class="title">Home <em>Automation</em></h1>
          <div class="subtitle">Mega 2560 · 8-channel controller<span id="uptime"></span></div>
        </div>
      </div>
      <div class="gauges">
        <div class="gauge" id="lan"><div class="label">Local network</div>
          <div class="status"><span class="dot"></span><span class="state">Loading</span></div></div>
        <div class="gauge" id="cloud"><div class="label">Blynk cloud</div>
          <div class="status"><span class="dot"></span><span class="state">Loading</span></div></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-panel="dash">Dashboard</button>
    <button role="tab" aria-selected="false" data-panel="logs">Logs</button>
    <form class="logout" method="post" action="logout" id="logout" hidden>
      <button class="btn" type="submit">Log out</button>
    </form>
  </nav>

  <section id="dash">
    <h2>Climate</h2>
    <div class="dials">
      <div class="dial-card" id="tempDial"></div>
      <div class="dial-card" id="humDial"></div>
    </div>

    <h2>Relays</h2>
    <p id="relayNote" class="note" hidden></p>
    <div id="relays" class="grid"></div>

    <h2>Recent activity</h2>
    <div id="recent" class="log"></div>
    <div class="more"><button class="btn" id="viewAll">View all logs</button></div>
  </section>

  <section id="logs" hidden>
    <h2>Event log</h2>
    <div class="toolbar">
      <select id="day" aria-label="Day"><option value="">All days</option></select>
      <select id="kind" aria-label="Event type">
        <option value="">All events</option>
        <option value="relay">Relays</option>
        <option value="network">Network</option>
        <option value="system">System</option>
      </select>
      <input id="q" type="search" placeholder="Search, e.g. Relay 5 or IR remote" aria-label="Search">
    </div>
    <div class="toolbar">
      <span id="count" class="count"></span>
      <span class="spacer"></span>
      <a class="btn" id="dlDay" aria-disabled="true">Download day (.txt)</a>
      <a class="btn primary" href="api/logs.zip">Download all (.zip)</a>
    </div>
    <div id="entries" class="log"></div>
    <div class="more"><button class="btn" id="more" hidden>Load more</button></div>
    <div class="legend">
      <span><span class="dot relay"></span>Relay</span>
      <span><span class="dot network"></span>Network</span>
      <span><span class="dot system"></span>System</span>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const PAGE = 200;

async function api(path, options) {
  const r = await fetch(path, options);
  if (r.status === 401) {  // session expired or server restarted
    location.href = "login";
    throw new Error("Not logged in");
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmtDay(day) {
  const d = new Date(day + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}

// ---------- Tabs ----------
function showTab(panel) {
  for (const b of document.querySelectorAll("nav button")) {
    const on = b.dataset.panel === panel;
    b.setAttribute("aria-selected", on);
    $("#" + b.dataset.panel).hidden = !on;
  }
  if (panel === "logs") loadEntries(true);
  try { localStorage.setItem("tab", panel); } catch (_) {}
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => showTab(b.dataset.panel);
$("#viewAll").onclick = () => showTab("logs");

// ---------- Log rendering ----------
function renderEntries(container, entries, append) {
  if (!append) container.replaceChildren();
  let lastDay = append ? container.dataset.lastDay || "" : "";
  for (const e of entries) {
    const [day, time] = e.time.split(" ");
    if (day !== lastDay) {
      container.append(el("div", "day", fmtDay(day)));
      lastDay = day;
    }
    const row = el("div", "row");
    row.append(el("span", "dot " + e.kind), el("span", "time", time), el("span", "text", e.text));
    container.append(row);
  }
  container.dataset.lastDay = lastDay;
  if (!container.children.length) container.append(el("div", "empty", "No log entries."));
}

// ---------- Dashboard ----------
let status = null;

async function loadStatus() {
  try {
    status = await api("api/status");
  } catch (err) {  // the web app itself is unreachable
    status = { configured: true, reachable: false, error: "Can't reach the web app: " + err.message };
  }
  renderStatus();
}

function duration(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
}

function setLink(id, state, text) {
  $(id + " .dot").className = "dot " + state;
  $(id + " .state").textContent = text;
}

// ---------- Climate dials ----------
const SVG_NS = "http://www.w3.org/2000/svg";
const SEGMENTS = 46;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function svg(tag, attrs, parent, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  parent.append(e);
  return e;
}

// t = 0..1 along a 270° arc that opens at the bottom, like a rev counter
function polar(r, t) {
  const a = (135 + 270 * t) * Math.PI / 180;
  return [100 + r * Math.cos(a), 100 + r * Math.sin(a)];
}

function arcPath(r, t0, t1) {
  const [x0, y0] = polar(r, t0), [x1, y1] = polar(r, t1);
  return `M${x0} ${y0} A${r} ${r} 0 ${(t1 - t0) * 270 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}

function makeDial(container, cfg) {
  const range = cfg.max - cfg.min;
  const redT = (cfg.red - cfg.min) / range;
  const root = svg("svg", { viewBox: "0 0 200 186", class: "dial", role: "img", "aria-label": cfg.label }, container);
  svg("path", { d: arcPath(93, 0, 1), class: "ring" }, root);
  svg("path", { d: arcPath(68, redT, 1), class: "redline" }, root);

  const segs = [];
  for (let i = 0; i < SEGMENTS; i++) {
    const t = (i + 0.5) / SEGMENTS;
    const [x1, y1] = polar(74, t), [x2, y2] = polar(88, t);
    segs.push(svg("line", { x1, y1, x2, y2, class: "seg" + (t >= redT ? " red" : "") }, root));
  }
  for (const v of cfg.majors) {
    const t = (v - cfg.min) / range;
    const [x1, y1] = polar(66, t), [x2, y2] = polar(70, t), [tx, ty] = polar(57, t);
    svg("line", { x1, y1, x2, y2, class: "major" }, root);
    svg("text", { x: tx, y: ty, class: "tick" }, root, v);
  }
  const value = svg("text", { x: 100, y: 112, class: "value" }, root, "--");
  svg("text", { x: 100, y: 131, class: "unit" }, root, cfg.unit);
  const zone = svg("text", { x: 100, y: 150, class: "zone" }, root, "");
  svg("text", { x: 100, y: 180, class: "label" }, root, cfg.label.toUpperCase());

  let shown = null, target = null, frame = 0, sweptIn = false;

  function draw(v) {
    const t = v == null ? 0 : Math.min(1, Math.max(0, (v - cfg.min) / range));
    const lit = Math.round(t * SEGMENTS);
    segs.forEach((s, i) => s.classList.toggle("lit", i < lit));
    value.textContent = v == null ? "--" : v.toFixed(cfg.decimals);
  }

  function animate(from, to, ms) {
    return new Promise((done) => {
      const start = performance.now();
      cancelAnimationFrame(frame);
      const step = (now) => {
        const p = Math.min(1, (now - start) / ms);
        shown = from + (to - from) * (1 - Math.pow(1 - p, 3));  // ease out
        draw(shown);
        if (p < 1) frame = requestAnimationFrame(step); else done();
      };
      frame = requestAnimationFrame(step);
    });
  }

  return {
    async set(v) {
      if (v === target) return;
      target = v;
      const z = v == null ? null : cfg.zones.find(([limit]) => v < limit) || cfg.zones[cfg.zones.length - 1];
      zone.textContent = z ? z[1] : "";
      zone.classList.toggle("hot", v != null && v >= cfg.red);

      if (v == null || reducedMotion) {
        cancelAnimationFrame(frame);
        shown = v;
        return draw(v);
      }
      if (!sweptIn) {  // start-up sweep: full scale and back, like a cluster self-test
        sweptIn = true;
        await animate(cfg.min, cfg.max, 650);
        return animate(cfg.max, target, 800);
      }
      animate(shown ?? cfg.min, v, 600);
    },
  };
}

const tempDial = makeDial($("#tempDial"), {
  label: "Temperature", unit: "°C", min: 0, max: 50, red: 35, decimals: 1,
  majors: [0, 10, 20, 30, 40, 50],
  zones: [[18, "COLD"], [28, "NORMAL"], [35, "WARM"], [Infinity, "HOT"]],
});
const humDial = makeDial($("#humDial"), {
  label: "Humidity", unit: "% RH", min: 0, max: 100, red: 80, decimals: 0,
  majors: [0, 20, 40, 60, 80, 100],
  zones: [[30, "DRY"], [60, "NORMAL"], [80, "HUMID"], [Infinity, "VERY HUMID"]],
});

function renderStatus() {
  const s = status;
  const note = $("#relayNote");
  note.hidden = true;
  note.classList.remove("error");
  if (s.login) $("#logout").hidden = false;
  $("#uptime").textContent = s.reachable ? " · up " + duration(s.uptime) : "";

  if (!s.configured) {
    setLink("#lan", "", "Not set up");
    setLink("#cloud", "", "Unknown");
    note.textContent = "Set DEVICE_IP and DEVICE_KEY on the server to show the relays and control them from here.";
    note.hidden = false;
  } else if (!s.reachable) {
    setLink("#lan", "down", "Unreachable");
    setLink("#cloud", "", "Unknown");
    note.textContent = s.error + (s.lastSeenAgo != null ? ` (last reply ${duration(s.lastSeenAgo)} ago)` : "") +
      ". Check that the controller is powered and connected to the network.";
    note.classList.add("error");
    note.hidden = false;
  } else {
    setLink("#lan", "ok", "Online");
    setLink("#cloud", s.blynk ? "ok" : "bad", s.blynk ? "Connected" : "Offline");
    if (!s.blynk) {
      note.textContent = "Blynk is offline (internet or Blynk server down). You can still control everything from this page.";
      note.hidden = false;
    }
  }
  tempDial.set(s.reachable ? s.temperature ?? null : null);
  humDial.set(s.reachable ? s.humidity ?? null : null);

  const grid = $("#relays");
  grid.replaceChildren();
  grid.hidden = !s.relays;
  if (!s.relays) return;
  const canControl = s.reachable;

  for (const r of s.relays) {
    const card = el("div", "card" + (r.momentary ? " momentary" : r.on ? " on" : ""));
    card.append(el("span", "num", String(r.n).padStart(2, "0")));
    const head = el("div");
    head.append(el("div", "name", r.name), el("div", "kind", r.momentary ? "Momentary · 1 s pulse" : "Power · on / off"));
    card.append(head);

    if (r.momentary) {
      const btn = el("button", "btn primary", "Pulse");
      btn.disabled = !canControl;
      btn.onclick = () => relayAction(btn, r, {}, "Sent");
      card.append(btn);
    } else {
      const row = el("div", "row2");
      const btn = el("button", "btn" + (r.on ? "" : " primary"), r.on ? "Turn off" : "Turn on");
      btn.disabled = !canControl;
      btn.onclick = () => relayAction(btn, r, { on: !r.on }, r.on ? "Off" : "On");
      row.append(el("span", "led" + (r.on ? " on" : ""), r.on ? "ON" : "OFF"), btn);
      card.append(row);
    }
    grid.append(card);
  }
}

async function relayAction(btn, relay, body, doneText) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    // The reply is the controller's state right after the command
    const newStatus = await api("api/relay/" + relay.n, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    btn.textContent = doneText;
    setTimeout(() => { status = newStatus; renderStatus(); loadRecent(); }, 1200);
  } catch (err) {
    btn.textContent = label;
    btn.disabled = false;
    alert(relay.name + ": " + err.message);
  }
}

async function loadRecent() {
  try {
    const r = await api("api/entries?limit=15");
    renderEntries($("#recent"), r.entries, false);
  } catch (err) {
    $("#recent").replaceChildren(el("div", "empty error", err.message));
  }
}

// ---------- Logs ----------
let offset = 0;
let requestId = 0;

async function loadDays() {
  const days = await api("api/days").catch(() => []);
  const sel = $("#day");
  const current = sel.value;
  sel.replaceChildren(el("option", null, "All days"));
  sel.firstChild.value = "";
  for (const d of days) {
    const o = el("option", null, fmtDay(d.day));
    o.value = d.day;
    sel.append(o);
  }
  sel.value = current;
}

async function loadEntries(reset) {
  if (reset) offset = 0;
  const id = ++requestId;
  const params = new URLSearchParams({ offset, limit: PAGE });
  const day = $("#day").value, kind = $("#kind").value, q = $("#q").value.trim();
  if (day) params.set("day", day);
  if (kind) params.set("kind", kind);
  if (q) params.set("q", q);

  const dl = $("#dlDay");
  dl.setAttribute("aria-disabled", !day);
  if (day) dl.href = "api/logs/" + day + ".txt"; else dl.removeAttribute("href");

  try {
    const r = await api("api/entries?" + params);
    if (id !== requestId) return;  // a newer filter is already loading
    renderEntries($("#entries"), r.entries, !reset);
    offset += r.entries.length;
    $("#count").textContent = r.total === 1 ? "1 entry" : r.total.toLocaleString() + " entries";
    $("#more").hidden = offset >= r.total;
  } catch (err) {
    if (id !== requestId) return;
    $("#entries").replaceChildren(el("div", "empty error", err.message));
    $("#more").hidden = true;
  }
}

let searchTimer;
$("#q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadEntries(true), 250); };
$("#day").onchange = () => loadEntries(true);
$("#kind").onchange = () => loadEntries(true);
$("#more").onclick = () => loadEntries(false);

// ---------- Start ----------
loadStatus();
loadRecent();
loadDays();
let savedTab = "dash";
try { savedTab = localStorage.getItem("tab") || "dash"; } catch (_) {}
showTab(savedTab === "logs" ? "logs" : "dash");

// Refresh while the page is visible
setInterval(() => { if (!document.hidden) loadStatus(); }, 5000);
setInterval(() => { if (!document.hidden) loadRecent(); }, 15000);
setInterval(() => { if (!document.hidden) loadDays(); }, 60000);
</script>
</body>
</html>
